<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="manifest" href="manifest.json">
    <title>Naufal Workspace</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Naufal Workspace</h1>
            <p class="quote" id="quote-display">"Algorithm is the poetry of logic."</p>
        </header>

        <section class="schedule-section">
            <div class="section-label">
                <span class="red-line"></span>
                <h3>Active <span class="highlight">Schedule</span></h3>
            </div>
            <div id="schedule-grid" class="grid"></div>
        </section>

        <footer class="footer">
            <p>S1 Informatika — 103012540018</p>
            <p class="lily">🪻 L.H.S</p>
        </footer>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Error', err));
            });
        }
    </script>
    <script src="script.js" defer></script>
</body>
</html>
